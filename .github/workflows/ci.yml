name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace and documentation
        run: python -m scripts.validate_marketplace --check-docs

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
