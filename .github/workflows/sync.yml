name: sync-plugins

# Автообновление закреплённых коммитов скиллов (sha в marketplace.json):
# по расписанию (каждые 6 часов) и вручную кнопкой Run workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pinned plugin shas from skill repos
        run: python -m scripts.sync_plugins

      - name: Create reviewable pin update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "already up to date"
            exit 0
          fi

          existing_branch="$(gh pr list --base main --state open --json headRefName --jq '.[] | select(.headRefName | startswith("automation/update-plugin-pins-")) | .headRefName' | head -n 1)"
          if [ -n "$existing_branch" ]; then
            echo "an update PR is already open from $existing_branch"
            exit 0
          fi

          branch="automation/update-plugin-pins-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .claude-plugin/marketplace.json
          git commit -m "Update pinned plugin shas from skill repos"
          git push origin "HEAD:${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update pinned plugin shas from skill repos" \
            --body "This automated PR updates marketplace pins after the source repositories moved. Review the diff and CI before merging."
